services:
  postgres:
    image: postgres:15
    container_name: credit_scoring_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: credit_scoring_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  create-minio-bucket:
    image: minio/mc:latest
    container_name: credit_scoring_create_bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/mlflow;
      exit 0;
      "

  mlflow:
    image: python:3.11-slim
    container_name: credit_scoring_mlflow
    depends_on:
      - postgres
      - minio
      - create-minio-bucket
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_HOST_PORT:-5000}:5000"
    command: >
      /bin/sh -c "
      pip install mlflow boto3 psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts 'localhost:*,127.0.0.1:*,mlflow:5000,credit_scoring_mlflow:5000'
      --cors-allowed-origins 'http://localhost:*,http://127.0.0.1:*'
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_scoring_api
    depends_on:
      - mlflow
      - minio
      - postgres
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      DATABASE_URL: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"

  ai-agent:
    build:
      context: .
      dockerfile: ai_engineering/Dockerfile
    container_name: credit_scoring_ai_agent
    restart: unless-stopped
    depends_on:
      - mlflow
      - postgres
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: credit-scoring
      MLFLOW_MODEL_NAME: CreditScoringCatBoost
      MLFLOW_MODEL_ALIAS: champion
      AI_AUDIT_DATABASE_URL: postgresql+pg8000://mlflow:mlflow@postgres:5432/mlflow
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AI_AGENT_HOST_PORT:-8010}:8010"

  prometheus:
    image: prom/prometheus:latest
    container_name: credit_scoring_prometheus
    depends_on:
      - api
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: credit_scoring_grafana
    depends_on:
      - prometheus
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: credit_scoring_airflow_init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: credit-scoring-secret
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      DATABASE_URL: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      MONITORING_DATABASE_URL: postgresql+pg8000://mlflow:mlflow@postgres:5432/mlflow
    volumes:
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: credit_scoring_airflow_webserver
    depends_on:
      - airflow-init
      - postgres
      - mlflow
      - minio
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: credit-scoring-secret
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      DATABASE_URL: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      MONITORING_DATABASE_URL: postgresql+pg8000://mlflow:mlflow@postgres:5432/mlflow
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: credit_scoring_airflow_scheduler
    depends_on:
      - airflow-init
      - postgres
      - mlflow
      - minio
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: credit-scoring-secret
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      DATABASE_URL: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      MONITORING_DATABASE_URL: postgresql+pg8000://mlflow:mlflow@postgres:5432/mlflow
    volumes:
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    command: airflow scheduler

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: credit_scoring_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:${REDPANDA_HOST_PORT:-19092}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDPANDA_HOST_PORT:-19092}:19092"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDPANDA_ADMIN_HOST_PORT:-9644}:9644"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: credit_scoring_kafka_ui
    depends_on:
      - redpanda
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${KAFKA_UI_HOST_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: credit-scoring-redpanda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    container_name: credit_scoring_kafka_consumer
    restart: unless-stopped
    depends_on:
      - redpanda
      - mlflow
      - minio
      - postgres
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${KAFKA_CONSUMER_METRICS_HOST_PORT:-8001}:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INPUT_TOPIC: credit_applications
      KAFKA_OUTPUT_TOPIC: scoring_results
      KAFKA_CONSUMER_GROUP: credit-scoring-consumer
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      DATABASE_URL: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    container_name: credit_scoring_kafka_producer
    depends_on:
      - redpanda
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INPUT_TOPIC: credit_applications
      APPLICATION_INTERVAL_SECONDS: "5"
    command: python -u -m services.kafka_producer.application_producer

volumes:
  postgres_data:
  minio_data:
