name: AI Agent Image

on:
  push:
    branches:
      - main
      - feature/ai-engineering-command-center
    paths:
      - "ai_engineering/**"
      - "requirements.txt"
      - "k8s/agents/**"
      - ".github/workflows/ai-agent-image.yml"
  pull_request:
    paths:
      - "ai_engineering/**"
      - "requirements.txt"
      - "k8s/agents/**"
      - ".github/workflows/ai-agent-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q ai_engineering

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/credit-scoring-mlops-agent" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai_engineering/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build validation image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai_engineering/Dockerfile
          push: false
          load: false
