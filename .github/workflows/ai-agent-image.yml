name: AI Agent Image

on:
  push:
    branches:
      - main
      - feature/ai-engineering-command-center
    paths:
      - "ai_engineering/**"
      - "migrations/**"
      - "alembic.ini"
      - "requirements.txt"
      - "k8s/agents/**"
      - ".github/workflows/ai-agent-image.yml"
  pull_request:
    paths:
      - "ai_engineering/**"
      - "migrations/**"
      - "alembic.ini"
      - "requirements.txt"
      - "k8s/agents/**"
      - ".github/workflows/ai-agent-image.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q ai_engineering migrations

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/credit-scoring-mlops-agent" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai_engineering/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build validation image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai_engineering/Dockerfile
          push: false
          load: false

      - name: Pin Kubernetes manifests to built image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          image_tag="sha-${IMAGE_COMMIT}"
          image="ghcr.io/zokhidkhanjarov/credit-scoring-mlops-agent:${image_tag}"

          for manifest in \
            k8s/agents/ai-agent-deployment.yaml \
            k8s/agents/ai-reconciliation-worker.yaml
          do
            sed -i -E "s#(credit-scoring-mlops-agent:)sha-[0-9a-f]+#\1${image_tag}#g" "${manifest}"
          done

          grep -F "${image}" \
            k8s/agents/ai-agent-deployment.yaml \
            k8s/agents/ai-reconciliation-worker.yaml

      - name: Commit Kubernetes image provenance
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            k8s/agents/ai-agent-deployment.yaml \
            k8s/agents/ai-reconciliation-worker.yaml
          then
            echo "Kubernetes manifests already reference the built image."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            k8s/agents/ai-agent-deployment.yaml \
            k8s/agents/ai-reconciliation-worker.yaml
          git commit -m "chore(k8s): sync AI agent image [skip ci]"
          git push origin HEAD:main
