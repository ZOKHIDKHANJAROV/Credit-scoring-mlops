apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-engineering-agent
  namespace: ai-engineering
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-engineering-agent
  namespace: ai-engineering
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-engineering-agent
  namespace: ai-engineering
subjects:
  - kind: ServiceAccount
    name: ai-engineering-agent
    namespace: ai-engineering
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-engineering-agent
