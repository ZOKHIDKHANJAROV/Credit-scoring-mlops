apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engineering-agent
  namespace: ai-engineering
  labels:
    app.kubernetes.io/name: ai-engineering-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-engineering-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-engineering-agent
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/zokhidkhanjarov/credit-scoring-mlops-agent:sha-06fed5e
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - ai_engineering.api.agent_service:app
            - --host
            - 0.0.0.0
            - --port
            - "8010"
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "credit-scoring"
            - name: MLFLOW_MODEL_NAME
              value: "CreditScoringCatBoost"
            - name: MLFLOW_MODEL_ALIAS
              value: "champion"
            - name: AI_AUDIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-engineering-postgres
                  key: AI_AUDIT_DATABASE_URL
            - name: LLM_BASE_URL
              value: "http://vllm:8000/v1"
            - name: LLM_API_KEY
              value: "local"
            - name: LLM_MODEL
              value: "Qwen/Qwen3-8B"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engineering-agent
  namespace: ai-engineering
  labels:
    app.kubernetes.io/name: ai-engineering-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    app.kubernetes.io/name: ai-engineering-agent
  ports:
    - name: http
      port: 8010
      targetPort: http
  type: ClusterIP
