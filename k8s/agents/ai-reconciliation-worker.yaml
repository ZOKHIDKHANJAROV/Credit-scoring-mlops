apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-reconciliation-worker
  namespace: ai-engineering
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-reconciliation-worker
  namespace: ai-engineering
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-reconciliation-worker
  namespace: ai-engineering
subjects:
  - kind: ServiceAccount
    name: ai-reconciliation-worker
    namespace: ai-engineering
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-reconciliation-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-reconciliation-worker
  namespace: ai-engineering
  labels:
    app.kubernetes.io/name: ai-reconciliation-worker
    app.kubernetes.io/component: reconciliation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-reconciliation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-reconciliation-worker
        app.kubernetes.io/component: reconciliation
    spec:
      serviceAccountName: ai-reconciliation-worker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciliation-worker
          image: ghcr.io/zokhidkhanjarov/credit-scoring-mlops-agent:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - ai_engineering.workers.reconciliation_worker
          env:
            - name: AI_RECONCILIATION_INTERVAL_SECONDS
              value: "30"
            - name: AI_RECONCILIATION_BATCH_SIZE
              value: "100"
            - name: AI_EXECUTION_LEASE_SECONDS
              value: "900"
            - name: AI_AUDIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-engineering-postgres
                  key: AI_AUDIT_DATABASE_URL
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "credit-scoring"
            - name: MLFLOW_MODEL_NAME
              value: "CreditScoringCatBoost"
            - name: MLFLOW_MODEL_ALIAS
              value: "champion"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
