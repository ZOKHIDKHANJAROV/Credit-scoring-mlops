apiVersion: v1
kind: Secret
metadata:
  name: ai-engineering-postgres
  namespace: ai-engineering
type: Opaque
stringData:
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: mlflow
  POSTGRES_DB: mlflow
  AI_AUDIT_DATABASE_URL: postgresql+pg8000://mlflow:mlflow@ai-engineering-postgres:5432/mlflow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-engineering-postgres
  namespace: ai-engineering
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engineering-postgres
  namespace: ai-engineering
  labels:
    app.kubernetes.io/name: ai-engineering-postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-engineering-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-engineering-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: ai-engineering-postgres
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mlflow
                - -d
                - mlflow
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mlflow
                - -d
                - mlflow
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: ai-engineering-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engineering-postgres
  namespace: ai-engineering
  labels:
    app.kubernetes.io/name: ai-engineering-postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: ai-engineering-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
