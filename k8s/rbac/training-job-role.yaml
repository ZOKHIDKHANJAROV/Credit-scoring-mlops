apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-job-manager
  namespace: ai-engineering
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-job-manager
  namespace: ai-engineering
subjects:
  - kind: ServiceAccount
    name: ai-engineering-agent
    namespace: ai-engineering
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: training-job-manager
